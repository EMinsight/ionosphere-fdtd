[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ionosphere-fdtd"
version = "0.1.0"
description = "NumPy and PyTorch geodesic FDTD model of the Earth-ionosphere waveguide"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
test = ["pytest>=8"]
pytorch = ["torch>=2.5"]
visualization = [
    "cartopy>=0.24",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
    "pyvista>=0.45",
]

[project.scripts]
ionosphere = "ionosphere.cli:main"
ionosphere-visualize = "ionosphere.viz_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
