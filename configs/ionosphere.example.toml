# Defaults for the `ionosphere` simulation runner.
[ionosphere]
steps = 20000
report_every = 1000
subdivision = 5
radial_cells = 40
courant = 0.35

backend = "torch"
device = "cuda:0"
dtype = "float32"
torch_compile = true
torch_compile_chunk_size = 32

source_current = 1.0e6
source_length = 5000.0
source_frequency = 20.0
source_latitude = 35.1595
source_longitude = 126.8526

# Paths are resolved relative to the directory where the command is run.
checkpoint = "artifacts/runs/example.npz"
checkpoint_every = 5000

# Shared defaults for `ionosphere-visualize`.
[visualization]
steps = 100
subdivision = 4
radial_cells = 40
backend = "torch"
device = "cuda:0"
dtype = "float32"

# Each visualization command has its own optional table.
[visualization.surface]
component = "er"
altitude_km = 0.0
projection = "mollweide"
scale = "symlog"
coastlines = true
output = "artifacts/figures/surface.png"

[visualization.traces]
trace_steps = 10000
sample_every = 10
receiver = [
  [35.1595, 126.8526, 0.0],
  [-35.1595, -53.1474, 0.0],
]
output = "artifacts/figures/traces.png"
